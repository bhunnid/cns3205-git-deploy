# .gitlab-ci.yml - the same pipeline for GitLab (Settings -> CI/CD -> Variables:
# SERVER_HOST, SERVER_USER, SSH_PRIVATE_KEY of type "File" or "Variable").
stages: [test, deploy]

lint:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck scripts/*.sh
    - grep -q 'id="app"' site/index.html

deploy:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  resource_group: production        # one deployment at a time
  before_script:
    - apk add --no-cache openssh-client curl
    - install -m 700 -d ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" "bash /var/www/cns3205/scripts/deploy.sh"
    - curl -fsS "http://$SERVER_HOST/version.json"
  environment:
    name: production
    url: http://$SERVER_HOST
