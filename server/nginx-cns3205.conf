# /etc/nginx/sites-available/cns3205 - serves the git clone's site/ folder
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/cns3205/site;
    index index.html;

    # Never expose the repository's internals
    location ~ /\.git { deny all; return 404; }

    # Version info must always be fresh
    location ~ ^/(version|history)\.json$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
